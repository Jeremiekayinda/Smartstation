<form method="post" action="{% url action_url %}" class="ss-logout-form">
  {% csrf_token %}
  <button type="submit" class="{{ button_class|default:'ss-navbar__link ss-logout-btn' }}">
    {% if icon %}<i class="bi bi-box-arrow-right"></i> {% endif %}{{ label|default:"Déconnexion" }}
  </button>
</form>
