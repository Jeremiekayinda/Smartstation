{% extends "stations/base_public.html" %}

{% block title %}Paramètres{% endblock %}

{% block content %}
<div style="max-width:560px;margin:2rem auto;padding:0 1rem">
  <div class="ss-card">
    <h1 class="h4 fw-bold mb-3"><i class="bi bi-gear text-warning"></i> Paramètres</h1>
    <ul class="list-group list-group-flush">
      <li class="list-group-item d-flex justify-content-between align-items-center px-0">
        <span>Notifications affluence</span>
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" checked disabled />
        </div>
      </li>
      <li class="list-group-item d-flex justify-content-between align-items-center px-0">
        <span>Géolocalisation automatique</span>
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" checked disabled />
        </div>
      </li>
      <li class="list-group-item px-0 text-muted small">
        Prototype — options complètes à venir.
      </li>
    </ul>
    <a href="{% url 'profile' %}" class="ss-btn ss-btn--ghost mt-3">← Retour au profil</a>
  </div>
</div>
{% endblock %}
